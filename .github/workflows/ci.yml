name: ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "api/**"
      - "worker/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            api:
              - 'api/**'
            worker:
              - 'worker/**'

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            changed: ${{ needs.changes.outputs.frontend }}
          - service: api
            changed: ${{ needs.changes.outputs.api }}
          - service: worker
            changed: ${{ needs.changes.outputs.worker }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip unchanged
        if: matrix.changed != 'true'
        run: echo "No changes for ${{ matrix.service }}" 

      - name: Tests
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install -r requirements.txt pytest
          pytest -q

      - name: Azure login
        if: matrix.changed == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: ACR login
        if: matrix.changed == 'true'
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/shop/${{ matrix.service }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Checkout GitOps repo
        if: matrix.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/shop-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump image tag in GitOps values
        if: matrix.changed == 'true'
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          cd gitops
          yq -i '.image.tag = "${{ github.sha }}"' environments/prod/${{ matrix.service }}-values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add environments/prod/${{ matrix.service }}-values.yaml
          git commit -m "chore(${{ matrix.service }}): deploy ${{ github.sha }}"
          git push
